<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dying Light Bio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            overflow: hidden;
            position: relative;
            cursor: none;
        }

        /* Background image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -3;
            filter: brightness(0.3) contrast(1.2);
        }

        /* Moon in background */
        .moon {
            position: fixed;
            top: 10%;
            right: 15%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 255, 200, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -2;
            box-shadow: 0 0 60px rgba(255, 255, 200, 0.2);
        }

        /* Zombie silhouettes */
        .zombies {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.1;
        }

        .zombie {
            position: absolute;
            bottom: 0;
            font-size: 80px;
            filter: blur(3px);
            animation: zombieSway 4s ease-in-out infinite;
        }

        @keyframes zombieSway {
            0%, 100% { transform: translateX(0) rotate(-2deg); }
            50% { transform: translateX(10px) rotate(2deg); }
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Film grain */
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJhIiB4PSIwIiB5PSIwIj48ZmVUdXJidWxlbmNlIGJhc2VGcmVxdWVuY3k9Ii43NSIgc3RpdGNoVGlsZXM9InN0aXRjaCIgdHlwZT0iZnJhY3RhbE5vaXNlIi8+PGZlQ29sb3JNYXRyaXggdHlwZT0ic2F0dXJhdGUiIHZhbHVlcz0iMCIvPjwvZmlsdGVyPjxwYXRoIGQ9Ik0wIDBoMzAwdjMwMEgweiIgZmlsdGVyPSJ1cmwoI2EpIiBvcGFjaXR5PSIuMDUiLz48L3N2Zz4=');
            z-index: 9997;
            pointer-events: none;
            opacity: 0.4;
            animation: grainMove 0.5s steps(2) infinite;
        }

        @keyframes grainMove {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -10%); }
            30% { transform: translate(3%, -15%); }
            50% { transform: translate(12%, 9%); }
            70% { transform: translate(9%, 4%); }
            90% { transform: translate(-1%, 7%); }
        }

        /* Chromatic aberration */
        .chromatic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9996;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: 0.05;
        }

        .chromatic::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(255, 0, 0, 0.3) 100%);
        }

        .chromatic::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0, 255, 255, 0.3) 100%);
            transform: translate(2px, 2px);
        }

        /* Scanlines effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 9998;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Dust particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 140, 0, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Custom cursor - FIXED */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #ff8c00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
        }

        .custom-cursor.hover {
            width: 40px;
            height: 40px;
            border-color: #ff6b00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
        }

        /* Main container */
        .container {
            max-width: 500px;
            width: 90%;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid rgba(255, 140, 0, 0.4);
            border-radius: 0;
            padding: 40px 35px;
            position: relative;
            box-shadow: 
                0 0 40px rgba(255, 140, 0, 0.3),
                inset 0 0 60px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 100;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0%, 100% { border-color: rgba(255, 140, 0, 0.4); }
            50% { border-color: rgba(255, 140, 0, 0.5); }
        }

        /* Blood splatters */
        .blood-splatter {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
        }

        .blood-1 {
            top: 10px;
            right: 30px;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.6) 0%, transparent 70%);
            filter: blur(2px);
        }

        .blood-2 {
            bottom: 20px;
            left: 40px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(139, 0, 0, 0.6) 0%, transparent 70%);
            filter: blur(2px);
        }

        /* Corner accents with rust texture */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border: 3px solid #ff8c00;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        .container::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .container::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .corner-tl,
        .corner-br {
            position: absolute;
            width: 25px;
            height: 25px;
            border: 3px solid #ff8c00;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        .corner-tl {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .corner-br {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        /* Warning stripe */
        .warning-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                45deg,
                #ff8c00,
                #ff8c00 10px,
                #000 10px,
                #000 20px
            );
            opacity: 0.8;
        }

        /* Barbed wire decoration */
        .barbed-wire {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(100, 100, 100, 0.3) 10%, 
                rgba(100, 100, 100, 0.3) 90%, 
                transparent 100%);
            opacity: 0.5;
        }

        /* Time of day indicator */
        .time-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff8c00;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Russo One', sans-serif;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .time-icon {
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        /* Profile section */
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .profile-img-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
            filter: drop-shadow(0 0 20px rgba(255, 140, 0, 0.6));
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border: 3px solid #ff8c00;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UV light effect */
        .profile-img::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(100, 150, 255, 0.15) 50%,
                transparent 70%
            );
            animation: uvPulse 4s infinite;
            z-index: 1;
        }

        @keyframes uvPulse {
            0%, 100% { 
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
                opacity: 0;
            }
            50% { 
                transform: translateX(100%) translateY(100%) rotate(45deg);
                opacity: 1;
            }
        }

        .status-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            background: #ff8c00;
            border-radius: 50%;
            border: 2px solid #0a0a0a;
            box-shadow: 0 0 15px rgba(255, 140, 0, 1);
            animation: pulse 2s infinite;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% { 
                opacity: 1;
                transform: scale(1);
            }
            50% { 
                opacity: 0.6;
                transform: scale(0.9);
            }
        }

        .username {
            font-size: 36px;
            font-weight: bold;
            color: #ff8c00;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 
                0 0 15px rgba(255, 140, 0, 0.8),
                0 0 30px rgba(255, 140, 0, 0.4),
                3px 3px 0 rgba(0, 0, 0, 0.9);
            margin-bottom: 10px;
            font-family: 'Russo One', sans-serif;
            position: relative;
        }

        /* Distressed text effect */
        .username::after {
            content: 'ARK';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            color: rgba(255, 140, 0, 0.3);
            text-shadow: 2px 2px 0 rgba(255, 140, 0, 0.3);
            z-index: -1;
        }

        .username:hover {
            animation: glitchText 0.3s infinite;
        }

        @keyframes glitchText {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .tagline {
            color: #aaa;
            font-size: 14px;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-family: 'Russo One', sans-serif;
        }

        /* Infection meter */
        .infection-meter {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 140, 0, 0.3);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .infection-fill {
            height: 100%;
            width: 85%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff8c00);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            animation: infectionPulse 2s infinite;
        }

        @keyframes infectionPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .infection-label {
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio-section {
            margin: 25px 0;
            padding: 20px;
            border-top: 1px solid rgba(255, 140, 0, 0.3);
            border-bottom: 1px solid rgba(255, 140, 0, 0.3);
            background: rgba(255, 140, 0, 0.05);
            position: relative;
        }

        .bio-text {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            font-style: italic;
        }

        /* Skill Tree Section */
        .skill-tree-header {
            text-align: center;
            margin: 30px 0 20px;
            position: relative;
        }

        .skill-tree-title {
            color: #ff8c00;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.7);
            margin-bottom: 10px;
            font-family: 'Russo One', sans-serif;
        }

        .skill-tree-subtitle {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .skill-tree {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 30px 0;
            position: relative;
        }

        /* Connection lines with glow */
        .skill-tree::before,
        .skill-tree::after {
            content: '';
            position: absolute;
            height: 2px;
            width: 80px;
            background: linear-gradient(90deg, transparent, rgba(255, 140, 0, 0.6), transparent);
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .skill-tree::before {
            left: 80px;
        }

        .skill-tree::after {
            right: 80px;
        }

        .skill-node {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .skill-node:hover {
            animation: screenShake 0.3s infinite;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }

        .skill-icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(10, 10, 10, 0.95);
            border: 3px solid rgba(255, 140, 0, 0.4);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .skill-node:hover .skill-icon-wrapper {
            border-color: #ff8c00;
            transform: scale(1.15);
            box-shadow: 
                0 0 40px rgba(255, 140, 0, 0.7),
                inset 0 0 30px rgba(255, 140, 0, 0.3);
        }

        .skill-icon {
            width: 32px;
            height: 32px;
            fill: #ff8c00;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.7));
            transition: all 0.3s ease;
        }

        .skill-node:hover .skill-icon {
            filter: drop-shadow(0 0 20px rgba(255, 140, 0, 1));
        }

        .skill-label {
            position: absolute;
            bottom: -25px;
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: color 0.3s ease;
            font-family: 'Russo One', sans-serif;
        }

        .skill-node:hover .skill-label {
            color: #ff8c00;
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.7);
        }

        /* Location */
        .location {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #666;
            font-size: 14px;
            font-family: 'Russo One', sans-serif;
        }

        .location svg {
            width: 18px;
            height: 18px;
            fill: #ff8c00;
            filter: drop-shadow(0 0 5px rgba(255, 140, 0, 0.5));
        }

        /* Audio toggle button */
        .audio-toggle {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: rgba(10, 10, 10, 0.95);
            border: 3px solid rgba(255, 140, 0, 0.4);
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: all 0.3s ease;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            cursor: none;
        }

        .audio-toggle:hover {
            border-color: #ff8c00;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.7);
            transform: scale(1.15);
            animation: screenShake 0.2s infinite;
        }

        .audio-icon {
            width: 28px;
            height: 28px;
            fill: #ff8c00;
            filter: drop-shadow(0 0 8px rgba(255, 140, 0, 0.7));
        }

        /* Copy notification */
        .copy-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 140, 0, 0.95);
            color: #000;
            padding: 12px 25px;
            border: 3px solid #ff6b00;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.8);
            font-family: 'Russo One', sans-serif;
        }

        .copy-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .username {
                font-size: 28px;
            }

            .skill-tree {
                gap: 25px;
            }

            .skill-tree::before,
            .skill-tree::after {
                width: 50px;
            }

            .skill-tree::before {
                left: 60px;
            }

            .skill-tree::after {
                right: 60px;
            }

            .skill-node {
                width: 60px;
                height: 60px;
            }

            .skill-icon-wrapper {
                width: 55px;
                height: 55px;
            }

            .skill-icon {
                width: 26px;
                height: 26px;
            }

            .audio-toggle {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }

            .audio-icon {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="moon"></div>
    <div class="zombies">

    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div class="chromatic"></div>
    <div class="scanlines"></div>
    
    <div class="particles" id="particles"></div>

    <audio id="bgAudio" loop>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

    <div class="container">
        <div class="warning-stripe"></div>
        <div class="barbed-wire"></div>
        <div class="corner-tl"></div>
        <div class="corner-br"></div>
        <div class="blood-splatter blood-1"></div>
        <div class="blood-splatter blood-2"></div>

        <div class="time-indicator">
            <span class="time-icon">🌙</span>
            <span>21:47 - NIGHT</span>
        </div>

        <div class="profile-header">
            <div class="profile-img-container">
                <div class="profile-img">
                    <img src="profile.png" alt="Profile">
                </div>
                <div class="status-indicator"></div>
            </div>
            <h1 class="username">ARK</h1>
            <p class="tagline">Volatile Hunter</p>
            <div class="infection-meter">
                <span class="infection-label">Antizin Level</span>
                <div class="infection-fill"></div>
            </div>
        </div>

        <div class="bio-section">
            <p class="bio-text">I toast a server on my pc</p>
        </div>

        <div class="skill-tree-header">
            <div class="skill-tree-title">◆ SURVIVOR SKILLS ◆</div>
            <div class="skill-tree-subtitle">Connect With The Runner</div>
        </div>

        <div class="skill-tree">
            <!-- Steam Icon -->

    <script>

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
// Audio control
const audio = document.getElementById('bgAudio');
const audioToggle = document.getElementById('audioToggle');
const audioIcon = document.getElementById('audioIcon');
let isMuted = false;

audio.volume = 0.5;
audio.muted = false;

// Try to autoplay
audio.play().then(() => {
    // Autoplay successful
    isMuted = false;
}).catch(() => {
    // Autoplay blocked, mute and wait for user interaction
    audio.muted = true;
    isMuted = true;
    audioIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
});

audioToggle.addEventListener('click', () => {
    if (isMuted) {
        audio.play();
        audio.muted = false;
        isMuted = false;
        audioIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';

        audio.muted = true;
        isMuted = true;
        audioIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

        });

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }

        // Copy to clipboard
        function copyText(text, event) {
            event.preventDefault();
            navigator.clipboard.writeText(text).then(() => {
                const notification = document.getElementById('notification');
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 2000);
            });
        }
